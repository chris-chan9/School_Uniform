<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Uniform Ordering System</title>
  <link rel="stylesheet" href="style.css"> <script src="script.js" defer> </script>
</head>
<body>

  <header>
    <div class="header-inner">
      <h1> School Uniform Ordering System</h1>
      <button type="button" class="btn light" id="viewOrdersBtn">View Orders</button>
    </div>
  </header>

  <!-- Success and error messages -->
  <div id="message" role="alert" aria-live="polite"></div>

  <main>

    <!-- DASHBOARD -->
    <section aria-label="Dashboard">
      <div class="cards">
        <div class="stat"><span>Total Orders</span><strong id="statOrders">0</strong></div>
        <div class="stat"><span>Total Sales</span><strong id="statSales">₱0.00</strong></div>
        <div class="stat"><span>Items Ordered</span><strong id="statItems">0</strong></div>
        <div class="stat"><span>Items In Stock</span><strong id="statStock">0</strong></div>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section class="box">
      <h2>Available Products</h2>
      <div class="products" id="productList"></div>
    </section>

    <!-- ORDER FORM -->
    <section class="box">
      <h2>Place an Order</h2>
      <form id="orderForm" novalidate>
        <div class="grid">
          <div class="field">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="" autocomplete="off">
            <small class="error" id="studentNameError"></small>
          </div>
          <div class="field">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" placeholder="" autocomplete="off">
            <small class="error" id="studentIdError"></small>
          </div>
          <div class="field">
            <label for="product">Product</label>
            <select id="product"></select>
            <small class="error" id="productError"></small>
          </div>
          <div class="field">
            <label for="size">Size</label>
            <select id="size"></select>
            <small class="error" id="sizeError"></small>
          </div>
          <div class="field">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" step="1" value="1">
            <small class="error" id="quantityError"></small>
          </div>
        </div>
        <p class="total-box">Total Price: <strong id="totalPrice">₱0.00</strong></p>
        <button type="submit" class="btn" id="placeOrderBtn">Place Order</button>
        <button type="button" class="btn gray" id="resetBtn">Reset Form</button>
      </form>
    </section>

    <!-- ORDERS -->
    <section class="box" id="ordersSection">
      <h2>Orders</h2>
      <form id="searchForm" class="search" novalidate>
        <input type="search" id="searchInput" placeholder="Search by student name or ID" aria-label="Search orders">
        <button type="submit" class="btn" id="searchBtn">Search</button>
      </form>
      <p class="count" id="orderCount"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Date</th><th>Student</th><th>Student ID</th><th>Product</th>
                <th>Size</th><th>Qty</th><th>Total</th><th>Action</th></tr>
          </thead>
          <tbody id="orderTable"></tbody>
        </table>
      </div>
    </section>

  </main>

  <footer>School Uniform Ordering System</footer>

  <script src="script.js"></script>
</body>
</html>
